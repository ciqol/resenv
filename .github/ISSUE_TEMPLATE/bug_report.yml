name: Bug report
description: Report a problem with environment resolution or package integration.
body:
  - type: markdown
    attributes:
      value: >-
        Use dummy values only. Do not attach dotenv files, tokens, provider
        responses or environment dumps. Follow SECURITY.md for vulnerabilities.
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: resenv version, Node.js version, OS, and loader such as Nx.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps using dummy references and values.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the safe error code, if any.
    validations:
      required: true
