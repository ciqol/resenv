name: Finalize release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['beta']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      reject:
        description: 'Exact version already rejected in npm; retain its reservation and resume queued work'
        type: string
        default: ''
        required: false

permissions: {}

jobs:
  record:
    if: vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/beta' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    concurrency:
      group: resenv-npm-release
      cancel-in-progress: false
    permissions:
      actions: write # Verify source checks and dispatch current beta after a terminal release.
      contents: write # Reconcile durable drafts and record the original approved source commit.
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      # Read durable release assets as data; never rebuild, restage or execute them.
      - name: Reconcile the pending release and resume queued merges
        run: node scripts/finalize-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          REJECT_VERSION: '${{ inputs.reject }}'
