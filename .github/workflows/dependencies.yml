name: Dependencies

on:
  push:
    branches: ['beta']
    paths:
      - 'package-lock.json'
      - 'package.json'
      - '.nvmrc'
      - 'scripts/dependency-snapshot.mjs'
      - '.github/workflows/dependencies.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Submit the repository dependency snapshot through the API.
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # Queued runs refresh the latest lockfile, regardless of push order.
          ref: 'beta'
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Generate the locked dependency snapshot without installing packages
        run: |
          npm sbom --package-lock-only --sbom-format=cyclonedx --include=dev --include=optional --include=peer > "$RUNNER_TEMP/dependency-bom.json"
          SNAPSHOT_SHA="$(git rev-parse HEAD)" node scripts/dependency-snapshot.mjs "$RUNNER_TEMP/dependency-bom.json" > "$RUNNER_TEMP/dependency-snapshot.json"
      - name: Refresh the dependency graph through the API
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh api --method POST --header 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/dependency-snapshot.json"
