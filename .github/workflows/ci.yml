name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: 'Setup Node.js'
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: 'Install'
        run: npm ci --no-audit --no-fund
      - name: 'Check dependencies, lint and types'
        run: |
          npm run audit
          npm audit signatures
          npm run lint
          npm run typecheck
      - name: 'Test with coverage'
        id: coverage
        run: npm run test:coverage
      - name: 'Upload coverage reports'
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-coverage'
          path: |
            coverage/cobertura-coverage.xml
            coverage/lcov.info
          if-no-files-found: 'error'
          retention-days: 7
      - name: 'Build and pack once'
        run: |
          npm run build
          mkdir candidate
          npm pack ./dist --pack-destination candidate
      - name: 'Test the packed candidate'
        run: |
          npm run test:package -- candidate/*.tgz
          npm run test:integration
      - name: 'Upload package tarball'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-package'
          path: |
            candidate/*.tgz
          if-no-files-found: 'error'
          retention-days: 7
          include-hidden-files: false

  smoke:
    needs: 'ci'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: 'read'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '20.x'
          - os: ubuntu-24.04
            node: '22.x'
          - os: ubuntu-24.04
            node: '24.x'
          - os: macos-15
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: 'Setup Node.js'
        uses: actions/setup-node@v6.5.0
        with:
          # An empty node-version falls back to the repository's .nvmrc.
          node-version: '${{ matrix.node }}'
          node-version-file: "${{ !matrix.node && '.nvmrc' || '' }}"
          package-manager-cache: false
      - name: 'Install'
        run: npm ci --no-audit --no-fund
      - name: 'Download package tarball'
        uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-package'
          path: 'artifacts'
          digest-mismatch: 'error'
      - name: 'Test packed package'
        run: npm run test:package -- artifacts/*.tgz
      - name: 'Load packed build'
        run: |
          mkdir dist
          tar -xzf artifacts/*.tgz -C dist --strip-components=1
      - name: 'Test processes'
        run: npm run test:integration

  coverage:
    needs: 'ci'
    # GitHub accepts reports for same-repository PRs or the default branch.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions:
      contents: 'read'
      code-quality: 'write' # Upload the source coverage report to GitHub.
      pull-requests: 'read' # Resolve associated PRs on push events.
    steps:
      - name: 'Download coverage reports'
        uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-coverage'
          digest-mismatch: 'error'
      - name: 'Upload to code coverage API'
        uses: actions/upload-code-coverage@v1.4.4
        with:
          file: 'cobertura-coverage.xml'
          language: 'TypeScript'
          label: 'code-coverage/vitest'
          # The first PR report processed after the default 160-second wait.
          wait-for-processing-timeout: '240'

  release:
    needs: ['ci', 'smoke', 'coverage']
    if: vars.RELEASE_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    environment: 'release'
    concurrency:
      group: 'resenv-release'
      cancel-in-progress: false
    permissions:
      contents: 'write' # semantic-release creates version tags and GitHub releases.
      issues: 'write' # The GitHub plugin comments, labels and reports release failures.
      pull-requests: 'write' # The GitHub plugin comments on and labels released PRs.
      id-token: 'write' # The npm plugin publishes through trusted publishing.
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 'Setup Node.js'
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: 'Install release tools'
        run: npm ci --no-audit --no-fund
      - name: 'Check release-tool review'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const { expires } = JSON.parse(readFileSync('docs/security-exceptions.json', 'utf8'))
          assert.ok(Date.now() < Date.parse(expires), 'Release-tool security review has expired')
          NODE
      - name: 'Download tested package'
        uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-package'
          path: 'artifacts'
          digest-mismatch: 'error'
      - name: 'Load tested build'
        run: |
          mkdir dist
          tar -xzf artifacts/*.tgz -C dist --strip-components=1
          npm pkg delete private --prefix dist
      - name: 'Release'
        run: npm run release
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          NPM_CONFIG_PROVENANCE: 'true'
