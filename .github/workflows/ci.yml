name: CI

on:
  push:
    branches: ['beta']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Stage the tested beta candidate or finalize an approved release'
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
      version: ${{ steps.candidate.outputs.version }}
      plan_sha256: ${{ steps.candidate.outputs.plan_sha256 }}
      archive_sha256: ${{ steps.candidate.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run audit
      - run: npm audit signatures
      - name: Lint implementation and build tooling
        run: npm run lint
      - name: Check TypeScript implementation
        run: npm run typecheck
      - name: Run unit specs with coverage
        run: npm run test:coverage
      - name: Save coverage reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-coverage'
          path: |
            coverage/cobertura-coverage.xml
            coverage/lcov.info
          if-no-files-found: 'error'
          retention-days: 7
      - name: Plan the version and notes without publishing
        run: node scripts/release-plan.mjs candidate
      - name: Build the final version once
        run: npm run build -- --release-plan candidate/release.json
      - run: npm pack ./dist --pack-destination candidate
      - name: Verify and record the candidate hashes
        id: candidate
        run: node scripts/record-artifact.mjs candidate
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-package'
          path: 'candidate/*'
          if-no-files-found: 'error'
          retention-days: 7
          include-hidden-files: false

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '20.x'
          - os: ubuntu-24.04
            node: '22.x'
          - os: ubuntu-24.04
          - os: macos-15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v6.5.0
        with:
          # An empty node-version falls back to the repository's .nvmrc.
          node-version: '${{ matrix.node }}'
          node-version-file: "${{ !matrix.node && '.nvmrc' || '' }}"
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-package'
          path: 'artifacts'
          digest-mismatch: 'error'
      - name: Verify the packed package
        run: npm run test:package -- artifacts/*.tgz artifacts/release.json
      - name: Load the same build for the process tests
        run: |
          mkdir dist
          tar -xzf artifacts/*.tgz -C dist --strip-components=1
      - run: npm run test:integration

  coverage:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      code-quality: write # Upload the source coverage report to GitHub.
      pull-requests: read # Resolve associated PRs on push events.
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-coverage'
          digest-mismatch: 'error'
      - uses: actions/upload-code-coverage@v1.4.4
        with:
          file: 'cobertura-coverage.xml'
          language: 'TypeScript'
          label: 'code-coverage/vitest'
          # The first PR report processed after the default 160-second wait.
          wait-for-processing-timeout: '240'

  release:
    needs: [build, test, coverage]
    # Enable only after the protected environment and npm authentication exist.
    if: vars.RELEASE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == 'refs/heads/beta' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: resenv-npm-release
      cancel-in-progress: false
    permissions:
      contents: write # Record verified release tags and prereleases.
      id-token: write # Stage the tested archive through npm OIDC.
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-package'
          path: 'artifacts'
          digest-mismatch: 'error'
      # No dependency installation, build, repack or package execution here.
      - name: Stage the verified archive or record an approved release
        run: node scripts/publish.mjs artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_APPROVED: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          PLAN_SHA256: ${{ needs.build.outputs.plan_sha256 }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
      - name: Save the npm staging receipt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-stage'
          path: 'artifacts/stage.json'
          if-no-files-found: 'ignore'
          retention-days: 7
