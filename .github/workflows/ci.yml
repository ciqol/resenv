name: CI

on:
  push:
    branches: ['beta']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Stage the tested beta candidate or finalize an approved release'
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    permissions:
      contents: 'read'
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
      version: ${{ steps.candidate.outputs.version }}
      plan_sha256: ${{ steps.candidate.outputs.plan_sha256 }}
      archive_sha256: ${{ steps.candidate.outputs.archive_sha256 }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: 'Setup Node.js'
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: 'Install'
        run: npm ci --no-audit --no-fund
      - name: 'Audit dependencies'
        run: npm run audit
      - name: 'Verify registry signatures'
        run: npm audit signatures
      - name: 'Lint'
        run: npm run lint
      - name: 'Typecheck'
        run: npm run typecheck
      - name: 'Test with coverage'
        id: coverage
        run: npm run test:coverage
      - name: 'Upload coverage reports'
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-coverage'
          path: |
            coverage/cobertura-coverage.xml
            coverage/lcov.info
          if-no-files-found: 'error'
          retention-days: 7
      - name: 'Plan candidate'
        run: node scripts/release-plan.mjs candidate
      - name: 'Build'
        run: npm run build -- --release-plan candidate/release.json
      - name: 'Pack tarball'
        run: npm pack ./dist --pack-destination candidate
      - name: 'Verify candidate hashes'
        id: candidate
        run: node scripts/record-artifact.mjs candidate
      - name: 'Test packed package'
        run: npm run test:package -- candidate/*.tgz candidate/release.json
      - name: 'Test processes'
        run: npm run test:integration
      - name: 'Upload package tarball'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-package'
          path: |
            candidate/*.tgz
            candidate/release.json
          if-no-files-found: 'error'
          retention-days: 7
          include-hidden-files: false

  smoke:
    needs: 'ci'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: 'read'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '20.x'
          - os: ubuntu-24.04
            node: '22.x'
          - os: macos-15
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: 'Setup Node.js'
        uses: actions/setup-node@v6.5.0
        with:
          # An empty node-version falls back to the repository's .nvmrc.
          node-version: '${{ matrix.node }}'
          node-version-file: "${{ !matrix.node && '.nvmrc' || '' }}"
          package-manager-cache: false
      - name: 'Install'
        run: npm ci --no-audit --no-fund
      - name: 'Download package tarball'
        uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-package'
          path: 'artifacts'
          digest-mismatch: 'error'
      - name: 'Test packed package'
        run: npm run test:package -- artifacts/*.tgz artifacts/release.json
      - name: 'Load packed build'
        run: |
          mkdir dist
          tar -xzf artifacts/*.tgz -C dist --strip-components=1
      - name: 'Test processes'
        run: npm run test:integration

  coverage:
    needs: 'ci'
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    permissions:
      contents: 'read'
      code-quality: 'write' # Upload the source coverage report to GitHub.
      pull-requests: 'read' # Resolve associated PRs on push events.
    steps:
      - name: 'Download coverage reports'
        uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-coverage'
          digest-mismatch: 'error'
      - name: 'Upload to code coverage API'
        uses: actions/upload-code-coverage@v1.4.4
        with:
          file: 'cobertura-coverage.xml'
          language: 'TypeScript'
          label: 'code-coverage/vitest'
          # The first PR report processed after the default 160-second wait.
          wait-for-processing-timeout: '240'

  release:
    needs: ['ci', 'smoke', 'coverage']
    # Enable only after the protected environment and npm authentication exist.
    if: vars.RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/beta' && needs.ci.outputs.publish == 'true'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    environment: 'release'
    concurrency:
      group: 'resenv-npm-release'
      cancel-in-progress: false
    permissions:
      contents: 'write' # Record verified release tags and prereleases.
      id-token: 'write' # Stage the tested archive through npm OIDC.
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: 'Setup Node.js'
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: 'Download package tarball'
        uses: actions/download-artifact@v8.0.1
        with:
          name: 'resenv-package'
          path: 'artifacts'
          digest-mismatch: 'error'
      # No dependency installation, build, repack or package execution here.
      - name: 'Stage or record release'
        run: node scripts/publish.mjs artifacts
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          RELEASE_APPROVED: '${{ inputs.publish }}'
          RELEASE_ENABLED: '${{ vars.RELEASE_ENABLED }}'
          PLAN_SHA256: '${{ needs.ci.outputs.plan_sha256 }}'
          ARCHIVE_SHA256: '${{ needs.ci.outputs.archive_sha256 }}'
      - name: 'Upload staging receipt'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'resenv-stage'
          path: 'artifacts/stage.json'
          if-no-files-found: 'ignore'
          retention-days: 7
