name: CI

on:
  push:
    # Keep this aligned with GitHub's actual default branch.
    branches: ['titan/bootstrap-envref']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run build
      - run: npm run pack:local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'resenv-package'
          path: 'ciqol-resenv-*.tgz'
          if-no-files-found: 'error'
          retention-days: 7
          include-hidden-files: false

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '20.x'
          - os: ubuntu-24.04
            node: '22.x'
          - os: ubuntu-24.04
          - os: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # An empty node-version falls back to the repository's .nvmrc.
          node-version: '${{ matrix.node }}'
          node-version-file: "${{ !matrix.node && '.nvmrc' || '' }}"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 'resenv-package'
          path: 'artifacts'
          digest-mismatch: 'error'
      - name: Verify the packed package
        run: npm run test:package -- artifacts/*.tgz
      - name: Load the same build for the process tests
        run: |
          mkdir dist
          tar -xzf artifacts/*.tgz -C dist --strip-components=1
      - run: npm test
